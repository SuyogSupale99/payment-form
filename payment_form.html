<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">    
 <form action="" method="get">
     <h1 class="Main_header">Payment Form</h1>
     <hr>
     <h2>User Information</h2>
     <p>Name:<input type="text" required name="name" placeholder="name"> </p>
  
  <p>
    <fieldset>
      <legend>Gender</legend>
      <p>Male<input type="radio" name="gender" id="male">Female<input type="radio" name="gender" id="female"</p>
    </fieldset>
  </p>
     <p>Address: <textarea placeholder="Enter your address" id="address"  rows="10" cols="90" ></textarea></p>
     <p>Email: <input type="email" placeholder="name@gmil.com" id="email"></p>
     <p>Pincode: <input type="number" name="pincode" id="pincode" placeholder="123456"></p>

    <hr>
    <h2>Payment Information</h2>
  <p>Card Type:
    <select name="card_type" id="card_type" required>
        <option value="">---Select Card Type---</option>
        <option value="visa">Visa</option>
        <option value="mastercard">MasterCard</option>
        <option value="rupay">rupay</option>
    </select>
  </p>
  <p>Card Number:
    <input type="number" name="card_number" id="card_number" required placeholder="1111-2222-3333-4444">
 </p>
  <p>Expiration Date:
    <input type="date" name="exp_date" id="exp_date" required>
  </p>
  <p>CVV:
    <input type="password" name="cvv" id="cvv" required placeholder="1234">
  </p>
  <p><input type="submit" value="Pay Now"</p>
  
    </form>
 </div>   

</body>
</html>
